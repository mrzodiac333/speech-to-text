<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech to Text</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js">
</script>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --text: #eee;
  --text2: #888;
  --border: #0f3460;
  --accent: #e94560;
  --accent2: #533483;
  --warning: #f5a623;
  --disabled: #333;
  --disabled-text: #555;
  --placeholder: #555;
  --viz-bg: #0f3460;
}
.light {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #e8ecf1;
  --text: #1a1a2e;
  --text2: #666;
  --border: #d0d5dd;
  --accent: #e94560;
  --accent2: #7c5cbf;
  --disabled: #ddd;
  --disabled-text: #aaa;
  --placeholder: #aaa;
  --viz-bg: #e8ecf1;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: background 0.3s, color 0.3s;
}
.container {
  background: var(--surface);
  padding: 1.25rem 1.5rem 1.5rem;
  border-radius: 16px;
  width: 92%;
  max-width: 760px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  transition: background 0.3s;
}
.tab-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 0.75rem;
  align-items: stretch;
  overflow-x: auto;
}
.tab {
  padding: 6px 14px;
  border-radius: 8px 8px 0 0;
  font-size: 0.8rem;
  cursor: pointer;
  background: var(--disabled);
  color: var(--disabled-text);
  border: none;
  white-space: nowrap;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab.active { background: var(--surface2); color: var(--text); }
.tab:hover:not(.active) { background: var(--border); color: var(--text); }
.tab-close {
  font-size: 0.7rem;
  opacity: 0.5;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
  padding: 0 2px;
}
.tab-close:hover { opacity: 1; }
.tab-add {
  padding: 6px 12px;
  border-radius: 8px 8px 0 0;
  font-size: 0.8rem;
  cursor: pointer;
  background: transparent;
  color: var(--text2);
  border: 1px dashed var(--border);
  transition: all 0.2s;
}
.tab-add:hover { color: var(--text); border-color: var(--text2); }
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0.75rem;
  padding: 8px 14px;
  background: var(--surface2);
  border-radius: 8px;
  font-size: 0.85rem;
  transition: background 0.3s;
}
.indicator {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
  transition: all 0.3s;
}
.indicator.listening { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1s infinite; }
.indicator.paused { background: var(--warning); box-shadow: 0 0 10px var(--warning); }
.indicator.idle { background: #555; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 4px var(--accent); }
  50% { box-shadow: 0 0 14px var(--accent); }
}
.lang-select {
  background: var(--surface);
  color: var(--text);
  border: none;
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 0.8rem;
  cursor: pointer;
}
.toggle-group {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  font-size: 1rem;
  padding: 2px 4px;
  border-radius: 4px;
  transition: all 0.2s;
}
.icon-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
.icon-btn.on { color: var(--accent); }
.toggle-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
}
.toggle-track {
  width: 30px;
  height: 16px;
  background: var(--disabled);
  border-radius: 8px;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle-track.on { background: var(--accent); }
.toggle-knob {
  width: 12px;
  height: 12px;
  background: #ccc;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: all 0.2s;
}
.toggle-track.on .toggle-knob { left: 16px; background: #fff; }
.visualizer-wrap {
  position: relative;
  height: 120px;
  background: var(--viz-bg);
  border-radius: 12px;
  margin-bottom: 0.5rem;
  overflow: hidden;
  opacity: 0.3;
  transition: opacity 0.3s, background 0.3s;
}
.visualizer-wrap.active { opacity: 1; }
#visualizer { width: 100%; height: 100%; display: block; }
.transcript-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.35rem;
  font-size: 0.8rem;
  color: var(--text2);
}
.text-area {
  background: var(--bg);
  border-radius: 8px;
  padding: 0.85rem;
  min-height: 150px;
  max-height: 280px;
  overflow-y: auto;
  font-size: 1.05rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
  border: 1px solid var(--border);
  margin-bottom: 0.4rem;
  outline: none;
  transition: background 0.3s, border-color 0.3s;
}
.text-area:empty::before {
  content: "Click 'Start Listening' and speak...";
  color: var(--placeholder);
}
.text-area .hl { background: var(--warning); color: #1a1a2e; border-radius: 2px; padding: 0 1px; }
.search-bar {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--surface2);
  border-radius: 6px;
  margin-bottom: 0.4rem;
  font-size: 0.8rem;
  transition: background 0.3s;
}
.search-bar.show { display: flex; }
.search-bar input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  color: var(--text);
  font-size: 0.8rem;
  outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar .match-info { color: var(--text2); white-space: nowrap; }
.controls-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn-start { background: var(--accent); color: white; }
.btn-start:hover { filter: brightness(1.1); }
.btn-pause { background: var(--warning); color: white; }
.btn-pause:hover { filter: brightness(1.1); }
.btn-pause:disabled { background: var(--disabled); color: var(--disabled-text); cursor: not-allowed; filter: none; }
.btn-stop { background: var(--accent2); color: white; }
.btn-stop:hover { filter: brightness(1.1); }
.btn-stop:disabled { background: var(--disabled); color: var(--disabled-text); cursor: not-allowed; filter: none; }
.btn-secondary { background: var(--surface2); color: var(--text2); }
.btn-secondary:hover { color: var(--text); filter: brightness(1.2); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text2); }
.ctrl-group { display: flex; gap: 4px; }
.ctrl-divider { width: 1px; background: var(--border); margin: 0 4px; align-self: stretch; }
.interim { color: var(--text2); font-style: italic; }
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 1.5rem;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal h2 { margin-bottom: 1rem; font-size: 1.1rem; }
.modal label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text2); }
.modal input[type="range"] { width: 100%; accent-color: var(--accent); }
.modal .btn { margin-top: 0.75rem; width: 100%; }
.export-menu {
  display: none;
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 50;
  min-width: 120px;
}
.export-menu.show { display: block; }
.export-menu button {
  display: block;
  width: 100%;
  padding: 8px 14px;
  border: none;
  background: none;
  color: var(--text);
  cursor: pointer;
  border-radius: 4px;
  text-align: left;
  font-size: 0.85rem;
}
.export-menu button:hover { background: var(--surface2); }
.export-wrap { position: relative; }
.font-val { font-size: 0.8rem; color: var(--text2); margin-left: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="tab-bar" id="tabBar"></div>
  <div class="status-bar">
    <span class="indicator idle" id="indicator"></span>
    <span id="statusText">Idle</span>
    <select class="lang-select" id="langSelect">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="it-IT">Italian</option>
      <option value="pt-BR">Portuguese (BR)</option>
      <option value="ja-JP">Japanese</option>
      <option value="ko-KR">Korean</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="ar-SA">Arabic</option>
      <option value="hi-IN">Hindi</option>
    </select>
    <div class="toggle-group">
      <div class="toggle-wrap" id="autoCorrectToggle" title="Auto-correct">
        <span>ABC</span>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
      </div>
      <div class="toggle-wrap" id="stampToggle" title="Timestamp markers">
        <span>⏱</span>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </div>
  <div class="visualizer-wrap" id="vizWrap">
    <canvas id="visualizer"></canvas>
  </div>
  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Find in transcript..." spellcheck="false">
    <span class="match-info" id="matchInfo"></span>
    <button class="icon-btn" id="searchPrev" title="Previous match">▲</button>
    <button class="icon-btn" id="searchNext" title="Next match">▼</button>
    <button class="icon-btn" id="searchClose" title="Close">✕</button>
  </div>
  <div class="transcript-label">
    <span>Transcript</span>
    <span id="wordCount">0 words</span>
  </div>
  <div class="text-area" id="result" contenteditable="true" role="log"></div>
  <div class="controls-row">
    <button class="btn btn-start" id="startBtn">Start</button>
    <button class="btn btn-pause" id="pauseBtn" disabled>Pause</button>
    <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
    <div class="ctrl-divider"></div>
    <button class="btn btn-secondary" id="undoBtn" disabled title="Undo (Ctrl+Z)">↩</button>
    <button class="btn btn-secondary" id="redoBtn" disabled title="Redo (Ctrl+Y)">↪</button>
    <div class="ctrl-divider"></div>
    <button class="btn btn-ghost" id="copyBtn">Copy</button>
    <button class="btn btn-ghost" id="clearBtn">Clear</button>
    <div class="export-wrap">
      <button class="btn btn-ghost" id="exportBtn">Export ▾</button>
      <div class="export-menu" id="exportMenu">
        <button data-format="txt">Plain Text (.txt)</button>
        <button data-format="md">Markdown (.md)</button>
        <button data-format="srt">Subtitles (.srt)</button>
        <button data-format="html">HTML (.html)</button>
        <button data-format="pdf">PDF (.pdf)</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <label>Font Size: <span class="font-val" id="fontVal">1.05rem</span></label>
    <input type="range" id="fontRange" min="0.7" max="2" step="0.05" value="1.05">
    <label style="margin-top:1rem">Auto-correct</label>
    <div class="toggle-wrap" id="autoCorrectToggle2" style="margin-bottom:0.5rem">
      <div class="toggle-track"><div class="toggle-knob"></div></div>
      <span style="color:var(--text2);font-size:0.85rem">Correct common misspellings</span>
    </div>
    <label>Timestamp markers</label>
    <div class="toggle-wrap" id="stampToggle2" style="margin-bottom:0.5rem">
      <div class="toggle-track"><div class="toggle-knob"></div></div>
      <span style="color:var(--text2);font-size:0.85rem">Prepend [HH:MM:SS] to speech blocks</span>
    </div>
    <button class="btn btn-secondary" id="settingsClose">Close</button>
  </div>
</div>
<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition, audioContext, analyser, source, stream;
let isPaused = false, isListening = false, autoCorrectEnabled = false, stampEnabled = false;
let animId = null, phase = 0, particles = [], searchIndex = 0;

// --- Session / Tab state ---
let sessions = [];
let currentTab = 0;
let nextTabId = 1;

function createSession(name) {
  return { id: nextTabId++, name, transcript: '', undo: [], redo: [] };
}

// --- DOM refs ---
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const exportBtn = document.getElementById('exportBtn');
const exportMenu = document.getElementById('exportMenu');
const resultDiv = document.getElementById('result');
const indicator = document.getElementById('indicator');
const statusText = document.getElementById('statusText');
const langSelect = document.getElementById('langSelect');
const wordCount = document.getElementById('wordCount');
const canvas = document.getElementById('visualizer');
const vizWrap = document.getElementById('vizWrap');
const ctx = canvas.getContext('2d');
const tabBar = document.getElementById('tabBar');
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
const matchInfo = document.getElementById('matchInfo');
const searchPrev = document.getElementById('searchPrev');
const searchNext = document.getElementById('searchNext');
const searchClose = document.getElementById('searchClose');
const themeToggle = document.getElementById('themeToggle');
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const settingsClose = document.getElementById('settingsClose');
const fontRange = document.getElementById('fontRange');
const fontVal = document.getElementById('fontVal');
const autoCorrectToggle = document.getElementById('autoCorrectToggle');
const autoCorrectToggle2 = document.getElementById('autoCorrectToggle2');
const stampToggle = document.getElementById('stampToggle');
const stampToggle2 = document.getElementById('stampToggle2');

for (const el of [autoCorrectToggle, autoCorrectToggle2]) {
  el.addEventListener('click', () => toggleAutoCorrect());
}
for (const el of [stampToggle, stampToggle2]) {
  el.addEventListener('click', () => toggleStamps());
}

function toggleAutoCorrect() {
  autoCorrectEnabled = !autoCorrectEnabled;
  for (const t of [autoCorrectToggle, autoCorrectToggle2]) {
    t.querySelector('.toggle-track').classList.toggle('on', autoCorrectEnabled);
  }
  const s = getSession();
  if (s && s.transcript) {
    s.transcript = processPunctuation(s.transcript);
    renderTranscript();
  }
}

function toggleStamps() {
  stampEnabled = !stampEnabled;
  for (const t of [stampToggle, stampToggle2]) {
    t.querySelector('.toggle-track').classList.toggle('on', stampEnabled);
  }
}

// --- Export ---
exportBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  exportMenu.classList.toggle('show');
});
document.addEventListener('click', () => exportMenu.classList.remove('show'));

document.querySelectorAll('.export-menu button').forEach(btn => {
  btn.addEventListener('click', () => {
    const fmt = btn.dataset.format;
    const text = resultDiv.textContent;
    if (!text.trim()) return;
    const s = getSession();
    downloadExport(fmt, text, s ? s.name : 'transcript');
    exportMenu.classList.remove('show');
  });
});

function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
}

function formatForExport(fmt, text, label) {
  const t = text.trim();
  switch (fmt) {
    case 'txt': return t;
    case 'md': return `# ${label}\n\n${t}`;
    case 'srt': return t.split('\n').filter(l => l.trim()).map((line, i) =>
      `${i + 1}\n${getTimestamp()} --> ${getTimestamp()}\n${line.trim()}\n`).join('\n');
    case 'html': return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${label}</title><style>body{font-family:sans-serif;max-width:700px;margin:40px auto;line-height:1.7;padding:0 20px}</style></head><body><h1>${label}</h1><p>${t.replace(/\n/g, '</p><p>')}</p></body></html>`;
    default: return t;
  }
}

function downloadExport(fmt, text, name) {
  if (fmt === 'pdf') {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const lines = doc.splitTextToSize(text.trim(), 170);
    doc.setFontSize(12);
    let y = 20;
    for (const line of lines) {
      if (y > 275) { doc.addPage(); y = 20; }
      doc.text(line, 20, y);
      y += 7;
    }
    doc.save(`${name}.pdf`);
    return;
  }
  const content = formatForExport(fmt, text, name);
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}.${fmt}`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- Undo / Redo ---
function pushUndo() {
  const s = getSession();
  if (!s) return;
  s.undo.push(s.transcript);
  if (s.undo.length > 50) s.undo.shift();
  s.redo = [];
  updateUndoButtons();
}

function undo() {
  const s = getSession();
  if (!s || !s.undo.length) return;
  s.redo.push(s.transcript);
  s.transcript = s.undo.pop();
  renderTranscript();
  updateUndoButtons();
}

function redo() {
  const s = getSession();
  if (!s || !s.redo.length) return;
  s.undo.push(s.transcript);
  s.transcript = s.redo.pop();
  renderTranscript();
  updateUndoButtons();
}

function updateUndoButtons() {
  const s = getSession();
  undoBtn.disabled = !s || !s.undo.length;
  redoBtn.disabled = !s || !s.redo.length;
}

undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);

// --- Sessions / Tabs ---
function getSession() { return sessions[currentTab]; }

function renderTabs() {
  tabBar.innerHTML = '';
  sessions.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === currentTab ? ' active' : '');
    btn.textContent = s.name;
    btn.addEventListener('click', () => switchTab(i));
    if (sessions.length > 1) {
      const close = document.createElement('span');
      close.className = 'tab-close';
      close.textContent = '✕';
      close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(i); });
      btn.appendChild(close);
    }
    tabBar.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'tab-add';
  addBtn.textContent = '+';
  addBtn.addEventListener('click', () => addTab());
  tabBar.appendChild(addBtn);
}

function switchTab(i) {
  if (i === currentTab) return;
  saveTranscriptFromEdit();
  currentTab = i;
  renderTabs();
  renderTranscript();
  updateUndoButtons();
  clearHighlight();
}

function closeTab(i) {
  if (sessions.length <= 1) return;
  sessions.splice(i, 1);
  if (currentTab >= sessions.length) currentTab = sessions.length - 1;
  renderTabs();
  renderTranscript();
  updateUndoButtons();
  clearHighlight();
}

function addTab() {
  if (isListening) { stopListening(); }
  const n = `Session ${sessions.length + 1}`;
  sessions.push(createSession(n));
  currentTab = sessions.length - 1;
  renderTabs();
  renderTranscript();
  updateUndoButtons();
  clearHighlight();
}

function saveTranscriptFromEdit() {
  const s = getSession();
  if (!s) return;
  const val = resultDiv.textContent;
  if (val !== s.transcript) {
    pushUndo();
    s.transcript = val;
  }
}

// --- Search ---
let searchMatches = [];

function clearHighlight() {
  const s = getSession();
  if (!s) return;
  resultDiv.innerHTML = s.transcript;
  searchMatches = [];
  matchInfo.textContent = '';
}

function doSearch(query) {
  const s = getSession();
  if (!query || !s) { clearHighlight(); return; }
  const text = s.transcript;
  const lower = text.toLowerCase();
  const q = query.toLowerCase();
  const idx = [];
  let pos = 0;
  while ((pos = lower.indexOf(q, pos)) !== -1) {
    idx.push(pos);
    pos += q.length;
  }
  searchMatches = idx;
  if (!idx.length) {
    resultDiv.innerHTML = text;
    matchInfo.textContent = 'No matches';
    return;
  }
  let html = '';
  let last = 0;
  for (const m of idx) {
    html += escHtml(text.slice(last, m));
    html += '<span class="hl">' + escHtml(text.slice(m, m + q.length)) + '</span>';
    last = m + q.length;
  }
  html += escHtml(text.slice(last));
  resultDiv.innerHTML = html;
  searchIndex = 0;
  updateMatchInfo();
  scrollToMatch(0);
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateMatchInfo() {
  matchInfo.textContent = searchMatches.length ? `${searchIndex + 1}/${searchMatches.length}` : '';
}

function scrollToMatch(i) {
  const hl = resultDiv.querySelectorAll('.hl');
  if (hl[i]) hl[i].scrollIntoView({ block: 'center' });
}

function goToMatch(dir) {
  if (!searchMatches.length) return;
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  updateMatchInfo();
  scrollToMatch(searchIndex);
  const hl = resultDiv.querySelectorAll('.hl');
  hl.forEach((el, i) => el.style.background = i === searchIndex ? 'var(--accent)' : 'var(--warning)');
}

searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchPrev.addEventListener('click', () => goToMatch(-1));
searchNext.addEventListener('click', () => goToMatch(1));
searchClose.addEventListener('click', () => { searchBar.classList.remove('show'); searchInput.value = ''; clearHighlight(); });

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    searchBar.classList.toggle('show');
    if (searchBar.classList.contains('show')) { searchInput.focus(); searchInput.select(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
});

// --- Theme ---
let isLight = false;
themeToggle.addEventListener('click', () => {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  themeToggle.textContent = isLight ? '☀️' : '🌙';
});

// --- Settings ---
settingsBtn.addEventListener('click', () => settingsModal.classList.add('show'));
settingsClose.addEventListener('click', () => settingsModal.classList.remove('show'));
settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('show'); });

fontRange.addEventListener('input', () => {
  const v = fontRange.value + 'rem';
  fontVal.textContent = v;
  resultDiv.style.fontSize = v;
});

// --- Punctuation & AutoCorrect ---
const PUNCT_MAP = {
  'period': '.', 'dot': '.', 'point': '.',
  'comma': ',',
  'question mark': '?',
  'exclamation point': '!', 'exclamation mark': '!',
  'new line': '\n', 'newline': '\n',
  'new paragraph': '\n\n',
  'colon': ':',
  'semicolon': ';',
  'space': ' ',
};
const END_MARKS = ['.', '!', '?'];
const CORRECTIONS = {
  'teh': 'the', 'recieve': 'receive', 'wierd': 'weird', 'acheive': 'achieve',
  'beleive': 'believe', 'seperate': 'separate', 'occured': 'occurred',
  'occuring': 'occurring', 'definately': 'definitely', 'definitly': 'definitely',
  'goverment': 'government', 'calender': 'calendar',
  'neccessary': 'necessary', 'necesary': 'necessary',
  'alot': 'a lot', 'alomst': 'almost', 'altho': 'although', 'becuz': 'because',
  'cuz': 'because', 'dont': "don't", 'cant': "can't",
  'im': "I'm", 'ive': "I've", 'id': "I'd", 'ill': "I'll", 'youre': "you're",
  'theyre': "they're", 'thats': "that's", 'whats': "what's", 'theres': "there's",
  'heres': "here's", 'wheres': "where's", 'whos': "who's",
  'didnt': "didn't", 'doesnt': "doesn't", 'isnt': "isn't", 'arent': "aren't",
  'wasnt': "wasn't", 'werent': "weren't", 'havent': "haven't", 'hasnt': "hasn't",
  'hadnt': "hadn't", 'couldnt': "couldn't", 'wouldnt': "wouldn't",
  'shouldnt': "shouldn't", 'mightnt': "mightn't", 'mustnt': "mustn't",
  'neednt': "needn't", 'cannot': 'cannot',
};

function applyAutoCorrect(text) {
  if (!autoCorrectEnabled) return text;
  return text.split(/(\s+)/).map(w => {
    const stripped = w.replace(/[^a-zA-Z']/g, '');
    if (!stripped) return w;
    const lower = stripped.toLowerCase();
    const corr = CORRECTIONS[lower];
    if (!corr) return w;
    const isUpper = stripped[0] === stripped[0].toUpperCase() && stripped[0] !== stripped[0].toLowerCase();
    return w.replace(stripped, isUpper ? corr.charAt(0).toUpperCase() + corr.slice(1) : corr);
  }).join('');
}

function processPunctuation(text) {
  const words = text.split(' ');
  const out = [];
  let capNext = false;
  for (let w of words) {
    const lower = w.toLowerCase();
    if (PUNCT_MAP[lower]) {
      const punct = PUNCT_MAP[lower];
      if (punct === '\n' || punct === '\n\n') out.push(punct);
      else out.push(punct);
      if (END_MARKS.includes(punct)) capNext = true;
    } else {
      if (capNext) { w = w.charAt(0).toUpperCase() + w.slice(1); capNext = false; }
      out.push(w);
    }
  }
  let r = out.join(' ');
  r = r.replace(/ ([.,!?;:])/g, '$1');
  r = r.replace(/ ([ \n])/g, '$1');
  r = r.replace(/\n +/g, '\n');
  return applyAutoCorrect(r);
}

// --- Render ---
function renderTranscript() {
  const s = getSession();
  if (!s) return;
  resultDiv.innerHTML = s.transcript;
  updateWordCount();
  clearHighlight();
}

function updateWordCount() {
  const text = resultDiv.textContent.trim();
  wordCount.textContent = text ? text.split(/\s+/).length + ' words' : '0 words';
}

function setStatus(state, msg) {
  indicator.className = 'indicator ' + state;
  statusText.textContent = msg;
}

function updateUI() {
  startBtn.disabled = isListening;
  pauseBtn.disabled = !isListening;
  stopBtn.disabled = !isListening;
  pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
  vizWrap.classList.toggle('active', isListening && !isPaused);
}

// --- Visualizer ---
function resizeCanvas() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function stopVisualizer() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (source) { source.disconnect(); source = null; }
  if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  analyser = null;
}

function startVisualizer() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
    stream = s;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 128;
    source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    draw();
  }).catch(() => {});
}

function draw() {
  if (!analyser) { animId = requestAnimationFrame(draw); return; }
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);
  resizeCanvas();
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = 'rgba(26, 26, 46, 0.15)';
  ctx.fillRect(0, 0, w, h);
  const barCount = 60;
  const step = Math.floor(bufferLength / barCount);
  const averages = [];
  for (let i = 0; i < barCount; i++) {
    let val = 0;
    for (let j = 0; j < step; j++) val += dataArray[i * step + j];
    averages.push(val / step / 255);
  }
  const bass = averages.slice(0, 4).reduce((a, b) => a + b, 0) / 4;
  phase += 0.015 + bass * 0.01;
  for (let layer = 0; layer < 3; layer++) {
    ctx.beginPath();
    const amp = 0.7 + layer * 0.15;
    const freq = 1.5 + layer * 0.8;
    const yOff = layer * 12 - 12;
    const alpha = 0.35 - layer * 0.1;
    for (let x = 0; x <= w; x += 2) {
      const t = x / w;
      const idx = Math.floor(t * barCount);
      const avg = averages[Math.min(idx, barCount - 1)] || 0;
      const smooth = avg * h * 0.35 * amp;
      const wave = Math.sin(t * Math.PI * freq + phase + layer) * h * 0.04;
      const y = h / 2 + wave + smooth * (t < 0.5 ? t * 2 : (1 - t) * 2) + yOff;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    const hue = 280 - layer * 40 + bass * 60;
    ctx.shadowBlur = 25;
    ctx.shadowColor = `hsla(${hue}, 80%, 60%, ${alpha * 0.6})`;
    ctx.strokeStyle = `hsla(${hue}, 75%, 55%, ${alpha})`;
    ctx.lineWidth = 4 - layer * 0.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  for (let x = 0; x <= w; x += 3) {
    const t = x / w;
    const idx = Math.floor(t * barCount);
    const avg = averages[Math.min(idx, barCount - 1)] || 0;
    if (avg > 0.2) {
      const y = h / 2 + Math.sin(t * Math.PI * 1.5 + phase) * h * 0.04 + avg * h * 0.35;
      const hue = 280 - avg * 160;
      ctx.shadowBlur = 15;
      ctx.shadowColor = `hsla(${hue}, 80%, 60%, ${avg * 0.3})`;
      ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${avg * 0.15})`;
      ctx.beginPath();
      ctx.arc(x, y, 1 + avg * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (Math.random() < bass * 0.4) {
    particles.push({
      x: Math.random() * w, y: h / 2 + (Math.random() - 0.5) * h * 0.2,
      vx: (Math.random() - 0.5) * 0.8, vy: -0.5 - Math.random() * 1.5,
      life: 1, decay: 0.005 + Math.random() * 0.01,
      size: 1 + Math.random() * 3, hue: 280 - bass * 160,
    });
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.01; p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsla(${p.hue}, 80%, 60%, ${p.life * 0.4})`;
    ctx.fillStyle = `hsla(${p.hue}, 80%, 70%, ${p.life * 0.6})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 20;
  ctx.shadowColor = `rgba(233, 69, 96, ${0.05 + bass * 0.15})`;
  ctx.fillStyle = `rgba(233, 69, 96, ${0.02 + bass * 0.08})`;
  ctx.fillRect(0, 0, w, h);
  ctx.shadowBlur = 0;
  animId = requestAnimationFrame(draw);
}

// --- Recognition ---
function startListening() {
  saveTranscriptFromEdit();
  if (isPaused) {
    isPaused = false;
    recognitionStart();
    startVisualizer();
    updateUI();
    return;
  }
  const s = getSession();
  if (s) { s.transcript = ''; }
  resultDiv.innerHTML = '';
  updateWordCount();
  recognitionStart();
  startVisualizer();
  updateUI();
}

function recognitionStart() {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = langSelect.value;
  isListening = true;
  recognition.onstart = () => { setStatus('listening', 'Listening...'); updateUI(); };
  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    setStatus('idle', 'Error: ' + e.error);
    isListening = false; updateUI();
  };
  recognition.onend = () => {
    if (isPaused) return;
    if (!isListening) return;
    setStatus('idle', 'Restarting...');
    recognition.start();
  };
  recognition.onresult = (e) => {
    let interim = '';
    let tempFinal = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        let block = r[0].transcript.trim();
        let stamp = stampEnabled ? getTimestamp() + ' ' : '';
        const processed = processPunctuation(block);
        tempFinal += stamp + processed + ' ';
      } else {
        interim += r[0].transcript;
      }
    }
    const s = getSession();
    if (!s) return;
    if (tempFinal) pushUndo();
    s.transcript += tempFinal;
    const display = processPunctuation(s.transcript);
    resultDiv.innerHTML = display + (interim ? '<span class="interim">' + interim + '</span>' : '');
    resultDiv.scrollTop = resultDiv.scrollHeight;
    updateWordCount();
  };
  recognition.start();
}

function pauseListening() {
  if (!isPaused) {
    isPaused = true;
    if (recognition) { recognition.stop(); recognition.onend = null; }
    stopVisualizer();
    setStatus('paused', 'Paused');
    updateUI();
  } else {
    isPaused = false;
    recognitionStart();
    startVisualizer();
    updateUI();
  }
}

function stopListening() {
  isPaused = false;
  isListening = false;
  if (recognition) { recognition.stop(); recognition.onend = null; }
  stopVisualizer();
  setStatus('idle', 'Idle');
  updateUI();
  saveTranscriptFromEdit();
}

// --- Click-to-edit ---
let editTimeout;
resultDiv.addEventListener('input', () => {
  clearTimeout(editTimeout);
  editTimeout = setTimeout(() => {
    const s = getSession();
    if (!s) return;
    const val = resultDiv.textContent;
    if (val !== s.transcript) {
      pushUndo();
      s.transcript = val;
      updateWordCount();
    }
  }, 400);
});

// --- Init ---
if (!SpeechRecognition) {
  resultDiv.textContent = 'Speech recognition not supported. Use Chrome or Edge.';
  startBtn.disabled = true;
} else {
  startBtn.addEventListener('click', startListening);
  pauseBtn.addEventListener('click', pauseListening);
  stopBtn.addEventListener('click', stopListening);
}
copyBtn.addEventListener('click', () => {
  const text = resultDiv.textContent;
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).then(() => {
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = orig, 1500);
  });
});
clearBtn.addEventListener('click', () => {
  saveTranscriptFromEdit();
  const s = getSession();
  if (s) { pushUndo(); s.transcript = ''; }
  resultDiv.innerHTML = '';
  updateWordCount();
  clearHighlight();
});

sessions.push(createSession('Session 1'));
renderTabs();
renderTranscript();
</script>
